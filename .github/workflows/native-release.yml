name: Native Release

# From v1.0.0 the shipping app is the native Kotlin app under native/.
# Push a tag like v1.0.0 to publish a GitHub Release with its builds.
on:
  push:
    tags: ["v1.*", "v2.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android:
    name: Native Android APK + AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure release signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KS_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASS=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - APK will be debug-signed and labelled accordingly."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build release APKs + AAB
        run: |
          if [ "$SIGNED" = "true" ]; then
            gradle :app:assembleRelease :app:bundleRelease --stacktrace \
              -Ppulse.keystoreFile="$KS_FILE" \
              -Ppulse.keystorePassword="$KS_PASS" \
              -Ppulse.keyAlias="$KS_ALIAS" \
              -Ppulse.keyPassword="$KEY_PASS"
          else
            gradle :app:assembleRelease :app:bundleRelease --stacktrace
          fi

      - name: Collect artifacts
        run: |
          mkdir -p ../artifacts
          OUT=app/build/outputs
          ls -la $OUT/apk/release $OUT/bundle/release
          suffix=""
          if [ "$SIGNED" != "true" ]; then suffix="-debug"; fi
          cp $OUT/apk/release/app-arm64-v8a-release.apk "../artifacts/pulse-android-arm64-v8a${suffix}.apk"
          cp $OUT/apk/release/app-armeabi-v7a-release.apk "../artifacts/pulse-android-armeabi-v7a${suffix}.apk"
          cp $OUT/bundle/release/app-release.aab ../artifacts/pulse-android-release.aab
          if [ "$SIGNED" = "true" ]; then
            BT=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
            "$BT/apksigner" verify ../artifacts/pulse-android-arm64-v8a.apk
            "$BT/apksigner" verify ../artifacts/pulse-android-armeabi-v7a.apk
            jarsigner -keystore "$KS_FILE" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              ../artifacts/pulse-android-release.aab "$KS_ALIAS"
          fi
          rm -f ../artifacts/*.idsig
          ls -la ../artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-native-android
          path: artifacts/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Pulse for Android - now a fully native Kotlin app (Jetpack
            Compose + Media3). Same package and signing key as before:
            it upgrades the Tauri build in place. Note: the library
            itself lives in the old app's web storage and cannot be
            carried over - rescan your folders once after upgrading;
            playlists and favourites start fresh.

            - Most users: install `pulse-android-arm64-v8a.apk`
            - Older 32-bit phones: `pulse-android-armeabi-v7a.apk`.
            - `pulse-android-release.aab` is for app stores, not sideloading.

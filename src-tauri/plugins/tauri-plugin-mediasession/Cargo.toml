[package]
name = "tauri-plugin-mediasession"
version = "0.1.0"
description = "Native Android media session (foreground playback service + notification transport controls) for Pulse"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-mediasession"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.7" }
thiserror = "=2.0.21"

[build-dependencies]
tauri-plugin = { version = "=2.7.4", features = ["build"] }
